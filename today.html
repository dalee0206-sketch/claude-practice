<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 날짜</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, "Malgun Gothic", sans-serif;
      background: #e3f0fc;
      color: #222;
    }
    .card {
      text-align: center;
      padding: 2.5rem 3rem;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1rem;
      font-weight: 500;
      color: #888;
    }
    #date {
      font-size: 2rem;
      font-weight: 700;
    }
    #time {
      margin-top: 0.75rem;
      font-size: 1.5rem;
      font-variant-numeric: tabular-nums;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>오늘 날짜</h1>
    <div id="date"></div>
    <div id="time"></div>
  </div>

  <script>
    function update() {
      const now = new Date();
      document.getElementById("date").textContent = now.toLocaleDateString("ko-KR", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long",
      });
      document.getElementById("time").textContent = now.toLocaleTimeString("ko-KR");
    }

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
